# Carga los ficheros NDJSON de datos/integrados/ en Elasticsearch.
# El nombre del fichero decide el índice: actividades.ndjson -> índice "actividades".

input {
  file {
    path => "/datos/integrados/*.ndjson"
    mode => "read"                                    # leer cada fichero completo, no seguirlo como un log
    codec => "json"                                   # cada línea es un documento JSON
    file_completed_action => "log"                    # por defecto, en modo read BORRA el fichero; así solo lo anota
    file_completed_log_path => "/tmp/ficheros_cargados.log"
    sincedb_path => "/dev/null"                       # sin memoria entre reinicios: al reiniciar, recarga todo
  }
}

filter {
  # Sacar el nombre del índice de la ruta del fichero
  grok {
    match => { "[log][file][path]" => "/datos/integrados/%{WORD:[@metadata][indice]}\.ndjson" }
  }
  # Quitar los campos que añade Logstash: no son del esquema unificado
  # y, con "dynamic": "strict", Elasticsearch rechazaría el documento
  mutate {
    remove_field => ["log", "event", "host", "@version", "@timestamp"]
  }
}

output {
  elasticsearch {
    hosts => ["http://es01:9200", "http://es02:9200", "http://es03:9200"]
    index => "%{[@metadata][indice]}"
    document_id => "%{id}"                            # mismo id -> se sobrescribe, nunca se duplica
  }
}